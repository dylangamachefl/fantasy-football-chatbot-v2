name: Agent Evaluation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  eval-and-test:
    runs-on: ubuntu-latest

    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Smoke Test Evals
        # We assume you create a smaller 'smoke_test.csv' for quick checks
        # Running the full 30-turn convo might cost too much time/money on every push
        run: |
          cd backend
          python run_conversation_evals.py --file data/smoke_test.csv --threshold 90

      - name: Archive Eval Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: backend/eval_results/
