version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - SIDECAR_URL=http://sidecar:8081
    env_file:
      - .env
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    depends_on:
      - sidecar

  sidecar:
    build: ./backend
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: python -m src.sidecar.main
    working_dir: /app

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:8000
    volumes:
      - ./frontend:/app
    command: streamlit run app.py
    working_dir: /app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
